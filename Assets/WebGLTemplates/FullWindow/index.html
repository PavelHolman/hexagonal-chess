<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #131010; }
      #unity-canvas { display: block; width: 100%; height: 100%; background: #131010; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 18px; font: 500 14px/1.4 system-ui, sans-serif; letter-spacing: 0.25em; color: #c9bda5;
      }
      #bar { width: 240px; height: 3px; background: #2b2420; border-radius: 2px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #f3e9d2; transition: width 0.2s; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">
      <div>{{{ PRODUCT_NAME.toUpperCase() }}}</div>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Phones report up to 3x; 2x looks the same and renders far fewer pixels
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      }, (progress) => {
        document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
      }).then(() => {
        document.querySelector("#loading").remove();
      }).catch((message) => {
        document.querySelector("#loading").textContent = message;
      });
    </script>
  </body>
</html>
